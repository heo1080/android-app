name: Build Dolphin Launcher V1

on:
  push:
    branches:
      - dolphin-launcher-v1
      - codex/v1-1.2.2-auto-evidence-upload
  pull_request:
    branches:
      - dolphin-launcher-v1
    paths:
      - "dolphin-launcher-v1/**"
      - ".github/workflows/dolphin-launcher-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-launcher:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build release
        env:
          DOLPHIN_UPLOAD_KEY: ${{ secrets.DOLPHIN_UPLOAD_KEY }}
        run: |
          test -n "$DOLPHIN_UPLOAD_KEY"
          gradle -p dolphin-launcher-v1 :app:assembleRelease --stacktrace

      - name: Validate identity
        shell: bash
        run: |
          set -euo pipefail
          APK="dolphin-launcher-v1/app/build/outputs/apk/release/app-release-unsigned.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          BADGING="$("$AAPT" dump badging "$APK" | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "package: name='com.dolphin.launcher.v1'"
          echo "$BADGING" | grep -q "versionCode='5'"
          echo "$BADGING" | grep -q "versionName='1.2.2-v1-auto-evidence-beta'"

      - name: Validate Registry v3 payload
        shell: bash
        run: |
          set -euo pipefail
          APK="dolphin-launcher-v1/app/build/outputs/apk/release/app-release-unsigned.apk"
          for F in verification_registry.json test_log_contracts.json feature_dependencies.json runtime_surfaces.json; do
            unzip -l "$APK" | grep -q "assets/$F"
          done
          unzip -p "$APK" assets/verification_registry.json > "$RUNNER_TEMP/verification_registry.json"
          python3 - "$RUNNER_TEMP/verification_registry.json" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1], encoding="utf-8"))
          assert d.get("schema_version")==3, d.get("schema_version")
          features=d.get("features", [])
          ids={tid for f in features for tid in f.get("test_ids", [])}
          assert len(features)==33, len(features)
          assert len(ids)==49, len(ids)
          print("REGISTRY_OK schema=3 features=33 test_ids=49")
          PY
          unzip -p "$APK" classes.dex | strings | grep -q "VerificationCenterActivity"
          unzip -p "$APK" classes.dex | strings | grep -q "VerificationEvidenceRuntime"
          unzip -p "$APK" classes.dex | strings | grep -q "AppUpdateManager"
          unzip -p "$APK" classes.dex | strings | grep -q "UpdateInstallReceiver"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump permissions "$APK" | grep -q "android.permission.INTERNET"
          "$AAPT" dump permissions "$APK" | grep -q "android.permission.REQUEST_INSTALL_PACKAGES"

      - name: Restore stable signing key
        shell: bash
        env:
          DOLPHIN_KEYSTORE_BASE64: ${{ secrets.DOLPHIN_KEYSTORE_BASE64 }}
          DOLPHIN_KEYSTORE_PASSWORD: ${{ secrets.DOLPHIN_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/dolphin-release.jks"
          printf '%s' "$DOLPHIN_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          PASS="$(printf '%s' "$DOLPHIN_KEYSTORE_PASSWORD" | tr -d '\r\n')"
          keytool -list -keystore "$KEYSTORE" -storepass "$PASS" -alias dolphinassistant >/dev/null

      - name: Sign Dolphin Launcher V1
        shell: bash
        env:
          DOLPHIN_KEYSTORE_PASSWORD: ${{ secrets.DOLPHIN_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          PASS="$(printf '%s' "$DOLPHIN_KEYSTORE_PASSWORD" | tr -d '\r\n')"
          export DOLPHIN_KS_PASS="$PASS"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          UNSIGNED="dolphin-launcher-v1/app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED="dolphin-launcher-v1/app/build/outputs/apk/release/DolphinLauncherV1-Evolution.apk"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/dolphin-release.jks" \
            --ks-key-alias dolphinassistant \
            --ks-pass env:DOLPHIN_KS_PASS \
            --key-pass env:DOLPHIN_KS_PASS \
            --out "$SIGNED" \
            "$UNSIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED"
          sha256sum "$SIGNED" | tee dolphin-launcher-v1/app/build/outputs/apk/release/DolphinLauncherV1-Evolution.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dolphin-Launcher-V1-Evolution
          path: |
            dolphin-launcher-v1/app/build/outputs/apk/release/DolphinLauncherV1-Evolution.apk
            dolphin-launcher-v1/app/build/outputs/apk/release/DolphinLauncherV1-Evolution.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish V1 OTA prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/dolphin-launcher-v1' && vars.V1_RELEASE_READY == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' dolphin-launcher-v1/app/build.gradle.kts | head -n 1)"
          SEMVER="$(printf '%s' "$VERSION" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          TAG="dolphin-launcher-v1-v${SEMVER}"
          APK="dolphin-launcher-v1/app/build/outputs/apk/release/DolphinLauncherV1-Evolution.apk"
          SHA="dolphin-launcher-v1/app/build/outputs/apk/release/DolphinLauncherV1-Evolution.sha256"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "OTA release $TAG already exists; leaving published assets unchanged."
          else
            gh release create "$TAG" "$APK" "$SHA" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Dolphin Launcher V1 ${SEMVER}" \
              --notes "Dolphin Launcher V1 OTA BETA. Package com.dolphin.launcher.v1. Android installer confirmation remains required." \
              --prerelease
          fi
