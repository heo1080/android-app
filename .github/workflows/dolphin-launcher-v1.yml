          kb=json.load(open("dolphin-launcher-v1/app/src/main/assets/known_bad_registry.json",encoding="utf-8"))
          print(",".join(r["id"] for r in kb["known_bad"] if r["severity"]=="P0" and r["state"]!="CLOSED"))
          PY
          )"
          cat > "$NOTES" <<EOF
          Dolphin Launcher V1 real-car validation BETA.

          - Package: com.dolphin.launcher.v1
          - Version: $VERSION (versionCode 6)
          - Channel: REAL_CAR_VALIDATION_BETA
          - Prerelease: true
          - Stable promotion: false
          - Open P0 Known-Bad: $OPEN_P0
          - CI success is not vehicle VERIFIED evidence.
          - Operator/runtime evidence is required before any real-car feature promotion.
          EOF

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG"               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "Dolphin Launcher V1 ${SEMVER} Real-Car BETA"               --notes-file "$NOTES"               --prerelease
          fi
          gh release edit "$TAG"             --repo "$GITHUB_REPOSITORY"             --title "Dolphin Launcher V1 ${SEMVER} Real-Car BETA"             --notes-file "$NOTES"             --prerelease
          gh release upload "$TAG" "$APK" "$SHA" "$META"             --repo "$GITHUB_REPOSITORY"             --clobber
          echo "REALCAR_BETA_RELEASE_OK tag=$TAG prerelease=true stable=false"

      - name: Enforce release Known-Bad gate
        if: github.event_name == 'push' && github.ref == 'refs/heads/dolphin-launcher-v1' && vars.V1_RELEASE_READY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          kb=json.load(open("dolphin-launcher-v1/app/src/main/assets/known_bad_registry.json", encoding="utf-8"))
          open_p0=[r["id"] for r in kb["known_bad"] if r["severity"]=="P0" and r["state"]!="CLOSED"]
          if open_p0:
              raise SystemExit("RELEASE_BLOCKED_OPEN_P0="+",".join(open_p0))
          print("RELEASE_KNOWN_BAD_GATE_OK")
          PY

      - name: Publish V1 OTA prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/dolphin-launcher-v1' && vars.V1_RELEASE_READY == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' dolphin-launcher-v1/app/build.gradle.kts | head -n 1)"
          SEMVER="$(printf '%s' "$VERSION" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          TAG="dolphin-launcher-v1-v${SEMVER}"
          APK="dolphin-launcher-v1/app/build/outputs/apk/release/DolphinLauncherV1-Evolution.apk"
          SHA="dolphin-launcher-v1/app/build/outputs/apk/release/DolphinLauncherV1-Evolution.sha256"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "OTA release $TAG already exists; leaving published assets unchanged."
          else
            gh release create "$TAG" "$APK" "$SHA" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Dolphin Launcher V1 ${SEMVER}" \
              --notes "Dolphin Launcher V1 OTA BETA. Package com.dolphin.launcher.v1. Android installer confirmation remains required." \
              --prerelease
          fi
