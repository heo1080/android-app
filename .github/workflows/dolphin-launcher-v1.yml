      - name: Restore stable signing key
        shell: bash
        env:
          DOLPHIN_KEYSTORE_BASE64: ${{ secrets.DOLPHIN_KEYSTORE_BASE64 }}
          DOLPHIN_KEYSTORE_PASSWORD: ${{ secrets.DOLPHIN_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/dolphin-release.jks"
          printf '%s' "$DOLPHIN_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          PASS="$(printf '%s' "$DOLPHIN_KEYSTORE_PASSWORD" | tr -d '\r\n')"
          keytool -list -keystore "$KEYSTORE" -storepass "$PASS" -alias dolphinassistant >/dev/null

      - name: Sign Dolphin Launcher V1
        shell: bash
        env:
          DOLPHIN_KEYSTORE_PASSWORD: ${{ secrets.DOLPHIN_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          PASS="$(printf '%s' "$DOLPHIN_KEYSTORE_PASSWORD" | tr -d '\r\n')"
          export DOLPHIN_KS_PASS="$PASS"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          UNSIGNED="dolphin-launcher-v1/app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED="dolphin-launcher-v1/app/build/outputs/apk/release/DolphinLauncherV1-Evolution.apk"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/dolphin-release.jks" \
            --ks-key-alias dolphinassistant \
            --ks-pass env:DOLPHIN_KS_PASS \
            --key-pass env:DOLPHIN_KS_PASS \
            --out "$SIGNED" \
            "$UNSIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED"
          sha256sum "$SIGNED" | tee dolphin-launcher-v1/app/build/outputs/apk/release/DolphinLauncherV1-Evolution.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dolphin-Launcher-V1-Evolution
          path: |
            dolphin-launcher-v1/app/build/outputs/apk/release/DolphinLauncherV1-Evolution.apk
            dolphin-launcher-v1/app/build/outputs/apk/release/DolphinLauncherV1-Evolution.sha256
          if-no-files-found: error
          retention-days: 30

