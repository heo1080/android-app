name: Build Dolphin Launcher V1

on:
  push:
    branches:
      - dolphin-launcher-v1
      - codex/v1-1.2.2-auto-evidence-upload
      - dolphin-launcher-v1-ui-reference-dock
  pull_request:
    branches:
      - dolphin-launcher-v1
      - dolphin-launcher-v1-ui-reference-dock
    paths:
      - "dolphin-launcher-v1/**"
      - ".github/workflows/dolphin-launcher-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dolphin-launcher-v1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-launcher:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate V1 CI policy
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^concurrency:' .github/workflows/dolphin-launcher-v1.yml
          grep -q 'cancel-in-progress: true' .github/workflows/dolphin-launcher-v1.yml
          grep -q 'group: dolphin-launcher-v1-' .github/workflows/dolphin-launcher-v1.yml
          python3 - <<'PY'
          from pathlib import Path
          workflow=Path(".github/workflows/dolphin-launcher-v1.yml").read_text(encoding="utf-8")
          pr_block=workflow.split("  pull_request:",1)[1].split("  workflow_dispatch:",1)[0]
          targets=("dolphin-launcher-v1","dolphin-launcher-v1-ui-reference-dock")
          for target in targets:
              assert f"      - {target}" in pr_block,target
          print("V1_PR_CI_TARGET_OK pull_request_targets=" + ",".join(targets))
          PY
          echo "V1_CI_POLICY_OK stale_runs_cancelled=true"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build release
        run: |
          gradle -p dolphin-launcher-v1 :app:assembleRelease --stacktrace

      - name: Validate identity
        shell: bash
        run: |
          set -euo pipefail
          APK="dolphin-launcher-v1/app/build/outputs/apk/release/app-release-unsigned.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          BADGING_ALL="$("$AAPT" dump badging "$APK")"
          BADGING="$(printf '%s\n' "$BADGING_ALL" | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "package: name='com.dolphin.launcher.v1'"
          echo "$BADGING" | grep -q "versionCode='6'"
          echo "$BADGING" | grep -q "versionName='1.2.3-v1-premium-realcar-beta'"
          printf '%s\n' "$BADGING_ALL" | grep -q "^sdkVersion:'29'$"
          printf '%s\n' "$BADGING_ALL" | grep -q "^targetSdkVersion:'35'$"
          printf '%s\n' "$BADGING_ALL" | grep -q "^launchable-activity: name='com.dolphin.launcher.v1.LauncherActivity'"
          python3 - dolphin-launcher-v1/app/src/main/AndroidManifest.xml <<'PY'
          import sys, xml.etree.ElementTree as ET
          manifest=ET.parse(sys.argv[1]).getroot()
          ns="{http://schemas.android.com/apk/res/android}"
          app=manifest.find("application")
          assert app is not None
          activities=app.findall("activity")
          def name(a): return a.get(ns+"name","")
          def categories(a):
              return {
                  c.get(ns+"name","")
                  for f in a.findall("intent-filter")
                  for c in f.findall("category")
              }
          def actions(a):
              return {
                  x.get(ns+"name","")
                  for f in a.findall("intent-filter")
                  for x in f.findall("action")
              }
          main=next((a for a in activities if name(a)==".LauncherActivity"),None)
          assert main is not None
          assert main.get(ns+"enabled","true")!="false"
          assert "android.intent.action.MAIN" in actions(main)
          assert "android.intent.category.LAUNCHER" in categories(main)
          slots=[a for a in activities if name(a).startswith(".DrawerSlotActivities$Slot")]
          assert len(slots)==16, len(slots)
          for slot in slots:
              assert slot.get(ns+"enabled")=="false", name(slot)
              assert slot.get(ns+"exported")=="true", name(slot)
              assert "android.intent.action.MAIN" in actions(slot), name(slot)
              assert "android.intent.category.LAUNCHER" in categories(slot), name(slot)
              assert "android.intent.category.HOME" not in categories(slot), name(slot)
          assert all(
              "android.intent.category.HOME" not in categories(a)
              for a in activities
          )
          print("MANIFEST_IDENTITY_OK main_launcher=1 drawer_slots=16 disabled_slots=16 home=0")
          PY
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          ns="{http://schemas.android.com/apk/res/android}"
          root=Path("dolphin-launcher-v1/app/src")
          main_manifest=ET.parse(root/"main/AndroidManifest.xml").getroot()
          app=main_manifest.find("application")
          assert app is not None
          assert app.get(ns+"icon")=="@mipmap/ic_launcher"
          assert app.get(ns+"roundIcon")=="@mipmap/ic_launcher_round"
          main_fg=root/"main/res/drawable/ic_launcher_foreground.xml"
          main_adaptive=root/"main/res/mipmap-anydpi-v26/ic_launcher.xml"
          main_round=root/"main/res/mipmap-anydpi-v26/ic_launcher_round.xml"
          preview_manifest=root/"voicePreview/AndroidManifest.xml"
          preview_fg=root/"voicePreview/res/drawable/ic_launcher_preview_foreground.xml"
          preview_adaptive=root/"voicePreview/res/mipmap-anydpi-v26/ic_launcher_preview.xml"
          preview_round=root/"voicePreview/res/mipmap-anydpi-v26/ic_launcher_preview_round.xml"
          for p in (main_fg,main_adaptive,main_round,preview_manifest,preview_fg,preview_adaptive,preview_round):
              assert p.is_file(), p
              ET.parse(p)
          preview_app=ET.parse(preview_manifest).getroot().find("application")
          assert preview_app is not None
          assert preview_app.get(ns+"icon")=="@mipmap/ic_launcher_preview"
          assert preview_app.get(ns+"roundIcon")=="@mipmap/ic_launcher_preview_round"
          assert preview_app.get(ns+"label")=="Dolphin Voice Preview"
          assert "launcher_icon_background" in (root/"main/res/values/launcher_icon_colors.xml").read_text(encoding="utf-8")
          assert "launcher_icon_preview_background" in (root/"main/res/values/launcher_icon_colors.xml").read_text(encoding="utf-8")
          print("ADAPTIVE_ICON_RESOURCE_OK canonical=true foreground_background=true byd_logo_copy=false")
          print("PREVIEW_ICON_VARIANT_OK package_suffix=.voicepreview distinct_icon=true distinct_label=true")
          PY
          MANIFEST_TREE="$("$AAPT" dump xmltree "$APK" AndroidManifest.xml)"
          printf '%s\n' "$MANIFEST_TREE" | grep -q "android.intent.category.LAUNCHER"
          if printf '%s\n' "$MANIFEST_TREE" | grep -q "android.intent.category.HOME"; then
            echo "HOME category must remain disabled until BYD real-car compatibility is proven" >&2
            exit 1
          fi
          echo "BUILD_IDENTITY_OK package=com.dolphin.launcher.v1 versionCode=6 minSdk=29 targetSdk=35 main_launcher=1 drawer_slots=16_disabled home=0"

      - name: Validate Registry v3 payload
        shell: bash
        run: |
          set -euo pipefail
          APK="dolphin-launcher-v1/app/build/outputs/apk/release/app-release-unsigned.apk"
          for F in verification_registry.json test_log_contracts.json feature_dependencies.json runtime_surfaces.json known_bad_registry.json voice_prompt_manifest.json; do
            unzip -l "$APK" | grep -q "assets/$F"
          done
          unzip -p "$APK" assets/verification_registry.json > "$RUNNER_TEMP/verification_registry.json"
          python3 - "$RUNNER_TEMP/verification_registry.json" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1], encoding="utf-8"))
          assert d.get("schema_version")==3, d.get("schema_version")
          features=d.get("features", [])
          ids={tid for f in features for tid in f.get("test_ids", [])}
          assert len(features)==36, len(features)
          assert len(ids)==54, len(ids)
          print("REGISTRY_OK schema=3 features=36 test_ids=54")
          PY
          unzip -p "$APK" assets/feature_dependencies.json > "$RUNNER_TEMP/feature_dependencies.json"
          python3 - "$RUNNER_TEMP/verification_registry.json" "$RUNNER_TEMP/feature_dependencies.json" <<'PY'
          import json, sys
          reg=json.load(open(sys.argv[1], encoding="utf-8"))
          dep=json.load(open(sys.argv[2], encoding="utf-8"))
          assert dep.get("schema_version")==1, dep.get("schema_version")
          ids={f["feature_id"] for f in reg.get("features", [])}
          pairs=set()
          graph={i:[] for i in ids}
          for edge in dep.get("edges", []):
              pair=(edge["feature_id"],edge["depends_on"])
              assert pair not in pairs, ("duplicate dependency", pair)
              pairs.add(pair)
              assert pair[0] in ids, ("unknown dependent feature", pair[0])
              assert pair[1] in ids, ("unknown dependency feature", pair[1])
              assert pair[0] != pair[1], ("self dependency", pair[0])
              graph[pair[0]].append(pair[1])
          visiting=set(); visited=set()
          def visit(node):
              assert node not in visiting, ("dependency cycle", node)
              if node in visited:
                  return
              visiting.add(node)
              for nxt in graph[node]:
                  visit(nxt)
              visiting.remove(node)
              visited.add(node)
          for node in ids:
              visit(node)
          # If a Registry dependency names another Feature ID explicitly, the
          # dependency graph must contain that exact edge. Human-readable
          # dependencies may remain as text without becoming graph nodes.
          explicit_registry_edges=set()
          for feature in reg.get("features", []):
              for dependency in feature.get("dependencies", []):
                  if dependency in ids:
                      explicit_registry_edges.add((feature["feature_id"],dependency))
          missing=explicit_registry_edges-pairs
          assert not missing, ("registry dependency graph drift", sorted(missing))
          print("FEATURE_DEPENDENCIES_OK edges=%d explicit_registry_edges=%d acyclic=true" %
                (len(pairs),len(explicit_registry_edges)))
          PY
          unzip -p "$APK" assets/test_log_contracts.json > "$RUNNER_TEMP/test_log_contracts.json"
          python3 - "$RUNNER_TEMP/verification_registry.json" "$RUNNER_TEMP/test_log_contracts.json" <<'PY'
          import json, pathlib, sys
          registry=json.load(open(sys.argv[1], encoding="utf-8"))
          contracts=json.load(open(sys.argv[2], encoding="utf-8"))
          features={f["feature_id"]: f for f in registry.get("features", [])}
          registered_test_ids={tid for f in features.values() for tid in f.get("test_ids", [])}
          seen=set()
          for contract in contracts.get("contracts", []):
              tid=contract["test_id"]
              fid=contract["feature_id"]
              assert tid not in seen, "duplicate test contract: "+tid
              seen.add(tid)
              assert fid in features, "contract feature missing from registry: "+fid
              assert tid in features[fid].get("test_ids", []), "test id not registered on feature: "+tid
              assert contract.get("feature_state")==features[fid].get("state"), (
                  "feature state drift %s: contract=%s registry=%s" %
                  (tid, contract.get("feature_state"), features[fid].get("state"))
              )
          assert seen==registered_test_ids, (
              "test contract coverage drift missing=%s extra=%s" %
              (sorted(registered_test_ids-seen), sorted(seen-registered_test_ids))
          )
          marker_success=[]
          for contract in contracts.get("contracts", []):
              for signal in contract.get("success_any", []):
                  if str(signal).startswith("observation="):
                      marker_success.append((contract["test_id"],signal))
          assert not marker_success, ("operator marker cannot be automatic success evidence",marker_success)

          by_test={c["test_id"]:c for c in contracts.get("contracts", [])}
          for token in ("ADAPTIVE_ICON_RESOURCE_OK","PREVIEW_ICON_VARIANT_OK"):
              assert token in features["LAUNCHER_ENTRY_IDENTITY"].get("required_logs",[]), ("identity registry token missing",token)
              assert token in by_test["LCH-ID-001"].get("required_logs",[]), ("identity contract token missing",token)
          for token in ("variant=glass-vector-v3-premium","source_live_not_verified=true","adaptive_icons=true"):
              assert token in features["PREMIUM_HMI_HOME"].get("required_logs",[]), ("premium HMI registry token missing",token)
              assert token in by_test["UI-HOME-001"].get("required_logs",[]), ("UI-HOME-001 token missing",token)
              assert token in by_test["UI-HOME-002"].get("required_logs",[]), ("UI-HOME-002 token missing",token)
          for test_id in ("COMF-LIGHT-001","COMF-LIGHT-002"):
              assert by_test[test_id]["allowed_outcomes"]==["NEED_MORE_DATA"], (
                  "interior light must remain fail-closed until V1 runtime exists",test_id,
                  by_test[test_id]["allowed_outcomes"]
              )
          activity=pathlib.Path("dolphin-launcher-v1/app/src/main/java/com/dolphin/launcher/v1/VerificationCenterActivity.java").read_text(encoding="utf-8")
          evidence_runtime=pathlib.Path("dolphin-launcher-v1/app/src/main/java/com/dolphin/launcher/v1/VerificationEvidenceRuntime.java").read_text(encoding="utf-8")
          assert "allowedOutcomesForTest" in activity and "loadTestContracts" in evidence_runtime
          assert "showP0Queue" in activity and "loadKnownBadRegistry" in evidence_runtime
          print("TEST_CONTRACT_STATE_OK contracts=%d operator_marker_success=0 interior_light_fail_closed=true p0_queue=true" % len(seen))
          PY
          unzip -p "$APK" assets/runtime_surfaces.json > "$RUNNER_TEMP/runtime_surfaces.json"
          python3 - "$RUNNER_TEMP/verification_registry.json" "$RUNNER_TEMP/runtime_surfaces.json" <<'PY'
          import json, pathlib, sys
          reg=json.load(open(sys.argv[1], encoding="utf-8"))
          d=json.load(open(sys.argv[2], encoding="utf-8"))
          assert d.get("schema_version")==2, d.get("schema_version")
          surfaces=d.get("surfaces", [])
          assert surfaces, "runtime surfaces empty"
          registry_ids={f["feature_id"] for f in reg.get("features", [])}
          surface_ids={s["feature_id"] for s in surfaces}
          assert registry_ids==surface_ids, (
              "registry/runtime feature drift",
              sorted(registry_ids-surface_ids), sorted(surface_ids-registry_ids)
          )
          surface_paths={}
          for s in surfaces:
              assert "required_tokens" not in s, ("legacy required_tokens schema forbidden",s["feature_id"],s["path"])
              assert isinstance(s.get("tokens"),list) and s.get("tokens"), ("surface tokens missing",s["feature_id"],s["path"])
              surface_paths.setdefault(s["feature_id"],set()).add(s["path"])
          missing=[]
          for feature in reg.get("features", []):
              declared=set(feature.get("source_paths", []))
              actual=surface_paths.get(feature["feature_id"],set())
              assert declared, ("registry source paths empty", feature["feature_id"])
              assert declared==actual, (
                  "registry source/runtime drift", feature["feature_id"],
                  sorted(declared-actual), sorted(actual-declared)
              )
          for surface in surfaces:
              raw_path=surface["path"]
              assert raw_path.startswith("dolphin-launcher-v1/"), ("non-V1 surface", raw_path)
              path=pathlib.Path(raw_path)
              if not path.is_file():
                  missing.append("%s: missing file %s" % (surface["feature_id"], path))
                  continue
              text=path.read_text(encoding="utf-8")
              absent=[token for token in surface.get("tokens", []) if token not in text]
              if absent:
                  missing.append("%s %s missing tokens=%s" % (
                      surface["feature_id"], path, ",".join(absent)))
          assert not missing, "runtime surface drift:\n" + "\n".join(missing)
          print("RUNTIME_SURFACE_OK surfaces=%d features=%d" % (len(surfaces), len(surface_ids)))
          PY
          unzip -p "$APK" assets/known_bad_registry.json > "$RUNNER_TEMP/known_bad_registry.json"
          python3 - "$RUNNER_TEMP/known_bad_registry.json" "$RUNNER_TEMP/verification_registry.json" <<'PY'
          import json, sys
          kb=json.load(open(sys.argv[1], encoding="utf-8"))
          reg=json.load(open(sys.argv[2], encoding="utf-8"))
          assert kb.get("schema_version")==1, kb.get("schema_version")
          features={f["feature_id"]:set(f.get("test_ids", [])) for f in reg.get("features", [])}
          rows=kb.get("known_bad", [])
          assert [r["id"] for r in rows]==["KB-%03d" % i for i in range(1,15)], "Known-Bad ID drift"
          library={r["id"]:r for r in reg.get("known_bad_library", [])}
          lifecycle={r["id"]:r for r in rows}
          assert set(library)==set(lifecycle), (
              "registry/lifecycle Known-Bad ID drift",
              sorted(set(library)-set(lifecycle)), sorted(set(lifecycle)-set(library))
          )
          for known_bad_id,row in lifecycle.items():
              master=library[known_bad_id]
              assert master.get("status")==row.get("state"), ("Known-Bad state drift",known_bad_id)
              assert set(master.get("required_test_ids",[]))==set(row.get("test_ids",[])), (
                  "Known-Bad Test ID drift",known_bad_id
              )
              assert master.get("severity")==row.get("severity"), ("Known-Bad severity drift",known_bad_id)
              assert row.get("feature_id") in master.get("linked",[]), ("Known-Bad feature link drift",known_bad_id)
          allowed={"OPEN","FIX_CANDIDATE","REAL_CAR_RETEST","CLOSED"}
          for row in rows:
              assert row["severity"] in {"P0","P1"}, ("invalid severity", row["id"])
              assert row["state"] in allowed, ("invalid state", row["id"])
              assert row["feature_id"] in features, ("unknown feature", row["id"])
              registered=features[row["feature_id"]]
              tests=set(row.get("test_ids", []))
              if row["id"]=="KB-010":
                  assert tests=={"BLD-ID-001","BLD-ID-002","LCH-ID-001"}, ("KB-010 tests drift", sorted(tests))
              else:
                  assert tests.issubset(registered), ("Known-Bad Test ID drift", row["id"], sorted(tests-registered))
              assert row.get("close_gate"), ("missing close gate", row["id"])
          assert not any(r["state"]=="CLOSED" for r in rows), "Known-Bad cannot close without committed real-car evidence"
          print("KNOWN_BAD_OK count=14 p0=%d" % sum(r["severity"]=="P0" for r in rows))
          PY
          unzip -p "$APK" classes.dex | strings | grep -q "VerificationCenterActivity"
          unzip -p "$APK" classes.dex | strings | grep -q "VerificationEvidenceRuntime"
          if unzip -p "$APK" classes.dex | strings | grep -q "EVIDENCE_UPLOAD_KEY"; then
            echo "APK-static evidence upload credential field is forbidden" >&2
            exit 1
          fi
          unzip -p "$APK" classes.dex | strings | grep -q "AppUpdateManager"
          unzip -p "$APK" classes.dex | strings | grep -q "UpdateInstallReceiver"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump permissions "$APK" | grep -q "android.permission.INTERNET"
          "$AAPT" dump permissions "$APK" | grep -q "android.permission.REQUEST_INSTALL_PACKAGES"
          python3 dolphin-launcher-v1/tools/generate_fixed_voice_assets.py check
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path("dolphin-launcher-v1")
          candidate_path=root/"tools/generate_ppaso_voice_candidate.py"
          candidate=candidate_path.read_text(encoding="utf-8")
          preview_preparer=(root/"tools/prepare_fixed_voice_preview.py").read_text(encoding="utf-8")
          build_gradle=(root/"app/build.gradle.kts").read_text(encoding="utf-8")
          update_manager=(root/"app/src/main/java/com/dolphin/launcher/v1/AppUpdateManager.java").read_text(encoding="utf-8")
          registry=json.load(open(root/"app/src/main/assets/verification_registry.json",encoding="utf-8"))
          contracts=json.load(open(root/"app/src/main/assets/test_log_contracts.json",encoding="utf-8"))
          surfaces=json.load(open(root/"app/src/main/assets/runtime_surfaces.json",encoding="utf-8"))

          for token in (
              'MODEL_REPO = "akamotaco/ppaso-tts-v1"',
              'DEFAULT_MODEL_REVISION = "53d09664c4f636a5fb6f2ebe3ec22cd83ee249b9"',
              'PROFILE_ID = "ppaso-v8-ko-female-24k-pcm-candidate-v1"',
              '"gear_p": "피"', '"gear_r": "알"', '"gear_n": "엔"', '"gear_d": "디"',
              '"icc_on": "아이씨씨 켜짐"', '"icc_off": "아이씨씨 꺼짐"',
              "candidate generation requires app manifest to remain ASSET_REQUIRED",
              "resample_to_24k", "write_pcm16_wav", "validate_wav",
              "PPASO_FIXED_VOICE_CANDIDATE_OK",
              "candidate_only=true", "app_manifest_unchanged=true",
              "--model-revision", '"model_revision": model_revision',
              "SILENCE_THRESHOLD_DB = -60.0", "LEADING_PAD_MS = 30",
              "TRAILING_PAD_MS = 60", "trim_candidate_silence",
              '"trimmed_leading_ms"', '"trimmed_trailing_ms"',
              '"original_duration_ms"', '"trim_policy"', "silence_trim_db=-60",
          ):
              assert token in candidate, token
          assert "app/src/main/res/raw" not in candidate, "candidate generator must not write packaged raw assets"
          assert "MANIFEST_PATH.write_text" not in candidate, "candidate generator must not promote app voice manifest"
          for token in (
              "canonical voice manifest must start ASSET_REQUIRED",
              'EXPECTED_PROFILE = "ppaso-v8-ko-female-24k-pcm-candidate-v1"',
              'EXPECTED_MODEL_REVISION = "53d09664c4f636a5fb6f2ebe3ec22cd83ee249b9"',
              'PREVIEW_PACKAGE = "com.dolphin.launcher.v1.voicepreview"',
              "preview overlay refuses pre-existing packaged asset",
              '"state"] = "ASSET_READY"', '"preview_only"] = True',
              '"canonical_repository_state": "ASSET_REQUIRED"',
              '"workspace_state": "ASSET_READY"', '"promotion_allowed": False',
              "VOICE_PREVIEW_OVERLAY_READY", "promotion_allowed=false",
          ):
              assert token in preview_preparer,token
          for token in (
              'buildConfigField("boolean", "VOICE_PREVIEW_BUILD", "false")',
              'create("voicePreview")','applicationIdSuffix = ".voicepreview"',
              'versionNameSuffix = "-voice-preview"',
              'buildConfigField("boolean", "VOICE_PREVIEW_BUILD", "true")',
          ):
              assert token in build_gradle,token
          for token in (
              "suppressForVoicePreview","BuildConfig.VOICE_PREVIEW_BUILD",
              "APP_UPDATE_SUPPRESSED_PREVIEW_BUILD",
              "voice_preview=true;network_check=false;installer=false",
              'suppressForVoicePreview(activity, "check", manual)',
              'suppressForVoicePreview(activity, "resume", false)',
          ):
              assert token in update_manager,token

          feature=next(f for f in registry["features"] if f["feature_id"]=="IN_APP_TTS_CORE")
          candidate_source="dolphin-launcher-v1/tools/generate_ppaso_voice_candidate.py"
          preview_source="dolphin-launcher-v1/tools/prepare_fixed_voice_preview.py"
          assert candidate_source in feature.get("source_paths",[])
          assert preview_source in feature.get("source_paths",[])
          assert "dolphin-launcher-v1/app/build.gradle.kts" in feature.get("source_paths",[])
          assert any("immutable full commit SHA" in item for item in feature.get("acceptance",[]))
          assert any("applicationIdSuffix=.voicepreview" in item for item in feature.get("acceptance",[]))
          assert any("canonical voice_prompt_manifest to start ASSET_REQUIRED" in item for item in feature.get("acceptance",[]))
          assert any("-60dB activity threshold" in item for item in feature.get("acceptance",[]))
          assert any("30ms pre-roll" in item and "최대 60ms" in item for item in feature.get("acceptance",[]))
          for tid in ("AUD-TTS-001","AUD-TTS-002"):
