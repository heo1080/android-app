name: Build Dolphin Launcher V1

on:
  push:
    branches:
      - dolphin-launcher-v1
      - codex/v1-1.2.2-auto-evidence-upload
  pull_request:
    branches:
      - dolphin-launcher-v1
    paths:
      - "dolphin-launcher-v1/**"
      - ".github/workflows/dolphin-launcher-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-launcher:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build release
        env:
          DOLPHIN_UPLOAD_KEY: ${{ secrets.DOLPHIN_UPLOAD_KEY }}
        run: |
          test -n "$DOLPHIN_UPLOAD_KEY"
          gradle -p dolphin-launcher-v1 :app:assembleRelease --stacktrace

      - name: Validate identity
        shell: bash
        run: |
          set -euo pipefail
          APK="dolphin-launcher-v1/app/build/outputs/apk/release/app-release-unsigned.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          BADGING="$("$AAPT" dump badging "$APK" | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "package: name='com.dolphin.launcher.v1'"
          echo "$BADGING" | grep -q "versionCode='5'"
          echo "$BADGING" | grep -q "versionName='1.2.2-v1-auto-evidence-beta'"

      - name: Validate Registry v3 payload
        shell: bash
        run: |
          set -euo pipefail
          APK="dolphin-launcher-v1/app/build/outputs/apk/release/app-release-unsigned.apk"
          for F in verification_registry.json test_log_contracts.json feature_dependencies.json runtime_surfaces.json known_bad_registry.json voice_prompt_manifest.json; do
            unzip -l "$APK" | grep -q "assets/$F"
          done
          unzip -p "$APK" assets/verification_registry.json > "$RUNNER_TEMP/verification_registry.json"
          python3 - "$RUNNER_TEMP/verification_registry.json" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1], encoding="utf-8"))
          assert d.get("schema_version")==3, d.get("schema_version")
          features=d.get("features", [])
          ids={tid for f in features for tid in f.get("test_ids", [])}
          assert len(features)==36, len(features)
          assert len(ids)==54, len(ids)
          print("REGISTRY_OK schema=3 features=36 test_ids=54")
          PY
          unzip -p "$APK" assets/feature_dependencies.json > "$RUNNER_TEMP/feature_dependencies.json"
          python3 - "$RUNNER_TEMP/verification_registry.json" "$RUNNER_TEMP/feature_dependencies.json" <<'PY'
          import json, sys
          reg=json.load(open(sys.argv[1], encoding="utf-8"))
          dep=json.load(open(sys.argv[2], encoding="utf-8"))
          assert dep.get("schema_version")==1, dep.get("schema_version")
          ids={f["feature_id"] for f in reg.get("features", [])}
          pairs=set()
          graph={i:[] for i in ids}
          for edge in dep.get("edges", []):
              pair=(edge["feature_id"],edge["depends_on"])
              assert pair not in pairs, ("duplicate dependency", pair)
              pairs.add(pair)
              assert pair[0] in ids, ("unknown dependent feature", pair[0])
              assert pair[1] in ids, ("unknown dependency feature", pair[1])
              assert pair[0] != pair[1], ("self dependency", pair[0])
              graph[pair[0]].append(pair[1])
          visiting=set(); visited=set()
          def visit(node):
              assert node not in visiting, ("dependency cycle", node)
              if node in visited:
                  return
              visiting.add(node)
              for nxt in graph[node]:
                  visit(nxt)
              visiting.remove(node)
              visited.add(node)
          for node in ids:
              visit(node)
          # If a Registry dependency names another Feature ID explicitly, the
          # dependency graph must contain that exact edge. Human-readable
          # dependencies may remain as text without becoming graph nodes.
          explicit_registry_edges=set()
          for feature in reg.get("features", []):
              for dependency in feature.get("dependencies", []):
                  if dependency in ids:
                      explicit_registry_edges.add((feature["feature_id"],dependency))
          missing=explicit_registry_edges-pairs
          assert not missing, ("registry dependency graph drift", sorted(missing))
          print("FEATURE_DEPENDENCIES_OK edges=%d explicit_registry_edges=%d acyclic=true" %
                (len(pairs),len(explicit_registry_edges)))
          PY
          unzip -p "$APK" assets/test_log_contracts.json > "$RUNNER_TEMP/test_log_contracts.json"
          python3 - "$RUNNER_TEMP/verification_registry.json" "$RUNNER_TEMP/test_log_contracts.json" <<'PY'
          import json, sys
          registry=json.load(open(sys.argv[1], encoding="utf-8"))
          contracts=json.load(open(sys.argv[2], encoding="utf-8"))
          features={f["feature_id"]: f for f in registry.get("features", [])}
          registered_test_ids={tid for f in features.values() for tid in f.get("test_ids", [])}
          seen=set()
          for contract in contracts.get("contracts", []):
              tid=contract["test_id"]
              fid=contract["feature_id"]
              assert tid not in seen, "duplicate test contract: "+tid
              seen.add(tid)
              assert fid in features, "contract feature missing from registry: "+fid
              assert tid in features[fid].get("test_ids", []), "test id not registered on feature: "+tid
              assert contract.get("feature_state")==features[fid].get("state"), (
                  "feature state drift %s: contract=%s registry=%s" %
                  (tid, contract.get("feature_state"), features[fid].get("state"))
              )
          assert seen==registered_test_ids, (
              "test contract coverage drift missing=%s extra=%s" %
              (sorted(registered_test_ids-seen), sorted(seen-registered_test_ids))
          )
          print("TEST_CONTRACT_STATE_OK contracts=%d" % len(seen))
          PY
          unzip -p "$APK" assets/runtime_surfaces.json > "$RUNNER_TEMP/runtime_surfaces.json"
          python3 - "$RUNNER_TEMP/verification_registry.json" "$RUNNER_TEMP/runtime_surfaces.json" <<'PY'
          import json, pathlib, sys
          reg=json.load(open(sys.argv[1], encoding="utf-8"))
          d=json.load(open(sys.argv[2], encoding="utf-8"))
          assert d.get("schema_version")==2, d.get("schema_version")
          surfaces=d.get("surfaces", [])
          assert surfaces, "runtime surfaces empty"
          registry_ids={f["feature_id"] for f in reg.get("features", [])}
          surface_ids={s["feature_id"] for s in surfaces}
          assert registry_ids==surface_ids, (
              "registry/runtime feature drift",
              sorted(registry_ids-surface_ids), sorted(surface_ids-registry_ids)
          )
          surface_paths={}
          for s in surfaces:
              surface_paths.setdefault(s["feature_id"],set()).add(s["path"])
          missing=[]
          for feature in reg.get("features", []):
              declared=set(feature.get("source_paths", []))
              actual=surface_paths.get(feature["feature_id"],set())
              assert declared, ("registry source paths empty", feature["feature_id"])
              assert declared==actual, (
                  "registry source/runtime drift", feature["feature_id"],
                  sorted(declared-actual), sorted(actual-declared)
              )
          for surface in surfaces:
              raw_path=surface["path"]
              assert raw_path.startswith("dolphin-launcher-v1/"), ("non-V1 surface", raw_path)
              path=pathlib.Path(raw_path)
              if not path.is_file():
                  missing.append("%s: missing file %s" % (surface["feature_id"], path))
                  continue
              text=path.read_text(encoding="utf-8")
              absent=[token for token in surface.get("tokens", []) if token not in text]
              if absent:
                  missing.append("%s %s missing tokens=%s" % (
                      surface["feature_id"], path, ",".join(absent)))
          assert not missing, "runtime surface drift:\n" + "\n".join(missing)
          print("RUNTIME_SURFACE_OK surfaces=%d features=%d" % (len(surfaces), len(surface_ids)))
          PY
          unzip -p "$APK" assets/known_bad_registry.json > "$RUNNER_TEMP/known_bad_registry.json"
          python3 - "$RUNNER_TEMP/known_bad_registry.json" "$RUNNER_TEMP/verification_registry.json" <<'PY'
          import json, sys
          kb=json.load(open(sys.argv[1], encoding="utf-8"))
          reg=json.load(open(sys.argv[2], encoding="utf-8"))
          assert kb.get("schema_version")==1, kb.get("schema_version")
          features={f["feature_id"]:set(f.get("test_ids", [])) for f in reg.get("features", [])}
          rows=kb.get("known_bad", [])
          assert [r["id"] for r in rows]==["KB-%03d" % i for i in range(1,13)], "Known-Bad ID drift"
          allowed={"OPEN","FIX_CANDIDATE","REAL_CAR_RETEST","CLOSED"}
          for row in rows:
              assert row["severity"] in {"P0","P1"}, ("invalid severity", row["id"])
              assert row["state"] in allowed, ("invalid state", row["id"])
              assert row["feature_id"] in features, ("unknown feature", row["id"])
              registered=features[row["feature_id"]]
              tests=set(row.get("test_ids", []))
              if row["id"]=="KB-010":
                  assert tests=={"BLD-ID-001","BLD-ID-002","LCH-ID-001"}, ("KB-010 tests drift", sorted(tests))
              else:
                  assert tests.issubset(registered), ("Known-Bad Test ID drift", row["id"], sorted(tests-registered))
              assert row.get("close_gate"), ("missing close gate", row["id"])
          assert not any(r["state"]=="CLOSED" for r in rows), "Known-Bad cannot close without committed real-car evidence"
          print("KNOWN_BAD_OK count=12 p0=%d" % sum(r["severity"]=="P0" for r in rows))
          PY
          unzip -p "$APK" classes.dex | strings | grep -q "VerificationCenterActivity"
          unzip -p "$APK" classes.dex | strings | grep -q "VerificationEvidenceRuntime"
          unzip -p "$APK" classes.dex | strings | grep -q "AppUpdateManager"
          unzip -p "$APK" classes.dex | strings | grep -q "UpdateInstallReceiver"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump permissions "$APK" | grep -q "android.permission.INTERNET"
          "$AAPT" dump permissions "$APK" | grep -q "android.permission.REQUEST_INSTALL_PACKAGES"
          unzip -p "$APK" assets/voice_prompt_manifest.json > "$RUNNER_TEMP/voice_prompt_manifest.json"
          python3 - "$RUNNER_TEMP/voice_prompt_manifest.json" "$APK" <<'PY'
          import json, pathlib, re, sys, zipfile
          manifest=json.load(open(sys.argv[1], encoding="utf-8"))
          assert manifest.get("schema_version")==1
          assert manifest.get("verification_policy",{}).get("semantic_contract_must_match_runtime") is True

          prompts=manifest.get("prompts", [])
          expected=[
              ("GEAR","P","gear_p","P"),
              ("GEAR","R","gear_r","R"),
              ("GEAR","N","gear_n","N"),
              ("GEAR","D","gear_d","D"),
              ("DRIVE_MODE","ECO","drive_eco","에코"),
              ("DRIVE_MODE","NORMAL","drive_normal","노멀"),
              ("DRIVE_MODE","SPORT","drive_sport","스포츠"),
              ("REGEN","STANDARD","regen_standard","회생제동 스탠다드"),
              ("REGEN","HIGH","regen_high","회생제동 하이"),
              ("SNOW","ON","snow_on","스노우 모드 켜짐"),
              ("SNOW","OFF","snow_off","스노우 모드 꺼짐"),
              ("AUTOHOLD_SWITCH","ON","autohold_on","오토홀드 켜짐"),
              ("AUTOHOLD_SWITCH","OFF","autohold_off","오토홀드 꺼짐"),
              ("AUTOHOLD_STATE","HELD","autohold_held","오토홀드 체결"),
              ("AUTOHOLD_STATE","RELEASED","autohold_released","오토홀드 해제"),
              ("EPB","HELD","epb_held","사이드 브레이크 체결"),
              ("EPB","RELEASED","epb_released","사이드 브레이크 해제"),
              ("ICC","ON","icc_on","ICC 켜짐"),
              ("ICC","OFF","icc_off","ICC 꺼짐"),
              ("LEADING_CAR","DEPARTED","leading_car_departure","전방 차량 출발"),
              ("BSD","LEFT","bsd_left","왼쪽 주의"),
              ("BSD","RIGHT","bsd_right","오른쪽 주의"),
          ]
          contract=[(p["event"],p["value"],p["id"],p["phrase"]) for p in prompts]
          assert contract==expected, ("voice semantic contract drift", contract)
          ids=[p["id"] for p in prompts]
          assert len(ids)==22 and len(ids)==len(set(ids)), "voice prompt id drift"
          states=[(p["event"],p["value"]) for p in prompts]
          assert len(states)==len(set(states)), "duplicate voice event/value state"
          for p in prompts:
              assert p["resource"]=="voice_"+p["id"], ("voice resource/id drift",p)
              assert p.get("state")=="ASSET_REQUIRED", ("unexpected asset state",p)

          policy=pathlib.Path("dolphin-launcher-v1/app/src/main/java/com/dolphin/launcher/v1/VehicleVoicePolicy.java").read_text(encoding="utf-8")
          policy_contract=re.findall(r'register\("([^"]+)","([^"]+)","([^"]+)","([^"]*)"\);',policy)
          assert policy_contract==expected, ("VehicleVoicePolicy contract drift", policy_contract)
          for prompt_id in ids:
              assert policy.count('"'+prompt_id+'"')==1, ("prompt id duplicated outside catalog",prompt_id)

          launcher=pathlib.Path("dolphin-launcher-v1/app/src/main/java/com/dolphin/launcher/v1/LauncherActivity.java").read_text(encoding="utf-8")
          assert "vehiclePromptPlayer.preload(VehicleVoicePolicy.promptIds());" in launcher, "voice preload must use policy catalog"
          assert launcher.count("vehiclePromptPlayer.preload(")==1, "duplicate voice preload call"
          android_manifest=pathlib.Path("dolphin-launcher-v1/app/src/main/AndroidManifest.xml").read_text(encoding="utf-8")
          assert 'android.intent.action.TTS_SERVICE' in android_manifest, "Android 11+ TTS service visibility query missing"
          assert r'\\n    <uses-permission' not in android_manifest, "literal \\n drift in AndroidManifest permissions"

          by_state={(e,v):(i,p) for e,v,i,p in expected}
          assert by_state[("DRIVE_MODE","NORMAL")]==("drive_normal","노멀")
          assert by_state[("REGEN","STANDARD")]==("regen_standard","회생제동 스탠다드")
          assert by_state[("SNOW","OFF")]==("snow_off","스노우 모드 꺼짐")
          assert by_state[("AUTOHOLD_STATE","HELD")]==("autohold_held","오토홀드 체결")
          assert by_state[("AUTOHOLD_STATE","RELEASED")]==("autohold_released","오토홀드 해제")

          monitor=pathlib.Path("dolphin-launcher-v1/app/src/main/java/com/dolphin/launcher/v1/VehicleReadOnlyMonitor.java").read_text(encoding="utf-8")
          assert 'Integer.valueOf(1).equals(drive)?"ECO"' in monitor
          assert ':Integer.valueOf(2).equals(drive)?"SPORT":null;' in monitor
          assert "normal-correlation-pending" in monitor
          assert 'listener.onDriveMode("NORMAL")' not in monitor
          assert 'post(()->listener.onRegen("HIGH"));' in monitor
          assert "standard-correlation-pending" in monitor
          assert 'listener.onRegen("STANDARD")' not in monitor

          assert 'Integer.valueOf(2).equals(raw) ? "ON"' in launcher
          assert 'Integer.valueOf(1).equals(raw) ? "OFF"' in launcher
          assert 'VehicleVoicePolicy.autoHoldSwitch' not in launcher
          assert 'VehicleVoicePolicy.autoHoldState' not in launcher
          assert "AUTOHOLD_RAW_TRANSITION" in launcher
          assert "AUTOHOLD_SWITCH_RAW_TRANSITION" in launcher
          assert "voice=suppressed-pending-correlation" in launcher
          print("VOICE_GATE_OK drive_normal=suppressed regen_standard=suppressed snow_raw=2_ON_1_OFF autohold=suppressed")

          with zipfile.ZipFile(sys.argv[2]) as z:
              names=z.namelist()
          missing=[]
          for p in prompts:
              resource=p["resource"]
              if not any(n.startswith("res/raw/") and ("/"+resource+".") in ("/"+n) for n in names):
                  missing.append(resource)
          print("VOICE_CONTRACT_OK prompts=22 semantic_pairs=22 preload_source=policy_catalog fixed_assets_present=%d missing=%d" % (22-len(missing), len(missing)))
          if missing:
              print("VOICE_FIXED_ASSETS_PENDING=" + ",".join(missing))
          PY

      - name: Restore stable signing key
        shell: bash
        env:
          DOLPHIN_KEYSTORE_BASE64: ${{ secrets.DOLPHIN_KEYSTORE_BASE64 }}
          DOLPHIN_KEYSTORE_PASSWORD: ${{ secrets.DOLPHIN_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/dolphin-release.jks"
          printf '%s' "$DOLPHIN_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          PASS="$(printf '%s' "$DOLPHIN_KEYSTORE_PASSWORD" | tr -d '\r\n')"
          keytool -list -keystore "$KEYSTORE" -storepass "$PASS" -alias dolphinassistant >/dev/null

      - name: Sign Dolphin Launcher V1
        shell: bash
        env:
          DOLPHIN_KEYSTORE_PASSWORD: ${{ secrets.DOLPHIN_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          PASS="$(printf '%s' "$DOLPHIN_KEYSTORE_PASSWORD" | tr -d '\r\n')"
          export DOLPHIN_KS_PASS="$PASS"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          UNSIGNED="dolphin-launcher-v1/app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED="dolphin-launcher-v1/app/build/outputs/apk/release/DolphinLauncherV1-Evolution.apk"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/dolphin-release.jks" \
            --ks-key-alias dolphinassistant \
            --ks-pass env:DOLPHIN_KS_PASS \
            --key-pass env:DOLPHIN_KS_PASS \
            --out "$SIGNED" \
            "$UNSIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED"
          sha256sum "$SIGNED" | tee dolphin-launcher-v1/app/build/outputs/apk/release/DolphinLauncherV1-Evolution.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dolphin-Launcher-V1-Evolution
          path: |
            dolphin-launcher-v1/app/build/outputs/apk/release/DolphinLauncherV1-Evolution.apk
            dolphin-launcher-v1/app/build/outputs/apk/release/DolphinLauncherV1-Evolution.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Enforce release Known-Bad gate
        if: github.event_name == 'push' && github.ref == 'refs/heads/dolphin-launcher-v1' && vars.V1_RELEASE_READY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          kb=json.load(open("dolphin-launcher-v1/app/src/main/assets/known_bad_registry.json", encoding="utf-8"))
          open_p0=[r["id"] for r in kb["known_bad"] if r["severity"]=="P0" and r["state"]!="CLOSED"]
          if open_p0:
              raise SystemExit("RELEASE_BLOCKED_OPEN_P0="+",".join(open_p0))
          print("RELEASE_KNOWN_BAD_GATE_OK")
          PY

      - name: Publish V1 OTA prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/dolphin-launcher-v1' && vars.V1_RELEASE_READY == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' dolphin-launcher-v1/app/build.gradle.kts | head -n 1)"
          SEMVER="$(printf '%s' "$VERSION" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          TAG="dolphin-launcher-v1-v${SEMVER}"
          APK="dolphin-launcher-v1/app/build/outputs/apk/release/DolphinLauncherV1-Evolution.apk"
          SHA="dolphin-launcher-v1/app/build/outputs/apk/release/DolphinLauncherV1-Evolution.sha256"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "OTA release $TAG already exists; leaving published assets unchanged."
          else
            gh release create "$TAG" "$APK" "$SHA" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Dolphin Launcher V1 ${SEMVER}" \
              --notes "Dolphin Launcher V1 OTA BETA. Package com.dolphin.launcher.v1. Android installer confirmation remains required." \
              --prerelease
          fi
