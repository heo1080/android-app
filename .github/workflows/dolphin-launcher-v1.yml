              "promotion_requires_real_car_evidence":True
          }
          json.dump(payload,open(out,"w",encoding="utf-8"),ensure_ascii=False,indent=2)
          print("REALCAR_BETA_METADATA_OK open_p0="+",".join(open_p0))
