name: Export Android apksigner

on:
  push:
    paths:
      - ".github/workflows/export-apksigner.yml"

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Locate Android apksigner
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          TOOL_DIR="$(dirname "$APKSIGNER")"
          mkdir -p "$RUNNER_TEMP/apksigner-tool/lib"
          cp "$APKSIGNER" "$RUNNER_TEMP/apksigner-tool/apksigner"
          cp "$TOOL_DIR/lib/apksigner.jar" "$RUNNER_TEMP/apksigner-tool/lib/apksigner.jar"
          chmod +x "$RUNNER_TEMP/apksigner-tool/apksigner"
          echo "source=$APKSIGNER"
          "$RUNNER_TEMP/apksigner-tool/apksigner" version

      - name: Upload apksigner tool
        uses: actions/upload-artifact@v4
        with:
          name: Android-apksigner-tool
          path: ${{ runner.temp }}/apksigner-tool
          if-no-files-found: error
          retention-days: 7
