name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: "17"
        distribution: "temurin"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Apply v30.6.3 live fixes
      run: |
        python3 ci/apply_v30_5.py
        python3 ci/fix_v30_5_1.py
        python3 ci/apply_v30_5_2_update.py
        python3 ci/apply_v30_5_3_tts_engine.py
        python3 ci/apply_v30_5_4_updater_fix.py
        python3 ci/apply_v30_6_integrated_beta.py
        python3 ci/fix_v30_6_compile.py
        python3 ci/prep_v30_6_2_compat.py
        python3 ci/apply_v30_6_2_runtime_fixes.py
        python3 ci/fix_v30_6_2_followup.py
        python3 ci/apply_v30_6_3_live_fixes.py

    - name: Download in-app sherpa-onnx Android runtime
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p app/libs
        curl -fL --retry 4 --retry-delay 2 \
          -o app/libs/sherpa-onnx-1.13.4.aar \
          https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.4/sherpa-onnx-1.13.4.aar
        test -s app/libs/sherpa-onnx-1.13.4.aar
        ls -lh app/libs/sherpa-onnx-1.13.4.aar

    - name: Build unsigned Release APK
      run: ./gradlew :app:assembleRelease --stacktrace

    - name: Upload unsigned Release APK for recovery signing
      uses: actions/upload-artifact@v4
      with:
        name: DolphinAssistant-v30.6.3-Unsigned
        path: app/build/outputs/apk/release/app-release-unsigned.apk
        if-no-files-found: error
        retention-days: 7

    - name: Decode and validate stable signing keystore
      if: github.event_name != 'pull_request'
      shell: bash
      env:
        DOLPHIN_KEYSTORE_BASE64: ${{ secrets.DOLPHIN_KEYSTORE_BASE64 }}
        DOLPHIN_KEYSTORE_PASSWORD: ${{ secrets.DOLPHIN_KEYSTORE_PASSWORD }}
      run: |
        set -euo pipefail
        KEYSTORE="$RUNNER_TEMP/dolphin-release.jks"
        printf '%s' "$DOLPHIN_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
        test -s "$KEYSTORE"
        EXPECTED_KEYSTORE_SHA256="6f343e0060b185d82a6002cf4be8650099a4ef02849083b210fba3bbe3889953"
        ACTUAL_KEYSTORE_SHA256="$(sha256sum "$KEYSTORE" | awk '{print $1}')"
        if [ "$ACTUAL_KEYSTORE_SHA256" != "$EXPECTED_KEYSTORE_SHA256" ]; then
          echo "Stable keystore identity MISMATCH"
          exit 41
        fi
        echo "Stable keystore identity OK"
        DOLPHIN_KS_PASS="$(printf '%s' "$DOLPHIN_KEYSTORE_PASSWORD" | tr -d '\r\n')"
        test -n "$DOLPHIN_KS_PASS"
        keytool -list \
          -keystore "$KEYSTORE" \
          -storepass "$DOLPHIN_KS_PASS" \
          -alias dolphinassistant >/dev/null
        echo "Stable keystore password/alias preflight OK"

    - name: Sign v30.6.3 stable APK
      if: github.event_name != 'pull_request'
      shell: bash
      env:
        DOLPHIN_KEYSTORE_PASSWORD: ${{ secrets.DOLPHIN_KEYSTORE_PASSWORD }}
      run: |
        set -euo pipefail
        DOLPHIN_KS_PASS="$(printf '%s' "$DOLPHIN_KEYSTORE_PASSWORD" | tr -d '\r\n')"
        export DOLPHIN_KS_PASS
        APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
        test -x "$APKSIGNER"
        UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
        SIGNED="app/build/outputs/apk/release/DolphinAssistant-v30.6.3-stable.apk"
        test -s "$UNSIGNED"
        "$APKSIGNER" sign \
          --ks "$RUNNER_TEMP/dolphin-release.jks" \
          --ks-key-alias dolphinassistant \
          --ks-pass env:DOLPHIN_KS_PASS \
          --key-pass env:DOLPHIN_KS_PASS \
          --out "$SIGNED" \
          "$UNSIGNED"
        "$APKSIGNER" verify --verbose --print-certs "$SIGNED"
        sha256sum "$SIGNED" | tee app/build/outputs/apk/release/DolphinAssistant-v30.6.3-stable.sha256

    - name: Upload stable APK artifact
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: DolphinAssistant-v30.6.3-Stable
        path: |
          app/build/outputs/apk/release/DolphinAssistant-v30.6.3-stable.apk
          app/build/outputs/apk/release/DolphinAssistant-v30.6.3-stable.sha256
        if-no-files-found: error
        retention-days: 30

    - name: Publish v30.6.3 GitHub Release
      if: github.event_name != 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        TAG="v30.6.3"
        APK="app/build/outputs/apk/release/DolphinAssistant-v30.6.3-stable.apk"
        SHA="app/build/outputs/apk/release/DolphinAssistant-v30.6.3-stable.sha256"
        NOTES="Live vehicle follow-up. Keeps confirmed gear/EPB/snow/stream14 voice paths intact. Fixes Dolphin regen mapping to 2=STANDARD and 3=HIGH, moves drive-mode detection to BYDAutoEnergyDevice.getOperationMode(), separates AutoHold switch speech from physical hold/release inference using D/speed/brake/accelerator signals, expands raw diagnostics for drive/regen/AutoHold/turn, adds interior-light raw calibration 0..4, and exposes the real per-app audio-routing blocker by reporting MODIFY_AUDIO_ROUTING plus output devices. Mirror 0..8 calibration remains available for direct stationary testing."
        if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release upload "$TAG" "$APK" "$SHA" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "DolphinAssistant v30.6.3" --notes "$NOTES" --latest
        else
          gh release create "$TAG" "$APK" "$SHA" \
            --repo "$GITHUB_REPOSITORY" \
            --title "DolphinAssistant v30.6.3" \
            --notes "$NOTES" \
            --latest
        fi
