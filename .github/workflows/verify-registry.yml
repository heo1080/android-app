name: Verify Master Registry

on:
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - "verification/**"
      - "app/**"
      - "ci/**"
      - ".github/workflows/build.yml"
      - ".github/workflows/verify-registry.yml"
  push:
    branches: [ "main", "master" ]
    paths:
      - "verification/**"
      - "app/**"
      - "ci/**"
      - ".github/workflows/build.yml"
      - ".github/workflows/verify-registry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Check Registry Change/Freshness Sync
        run: python3 verification/check_registry_change_sync.py
      - name: Validate Master Verification Registry
        run: python3 verification/validate_registry.py
      - name: Check Registry App Asset Drift
        run: python3 verification/build_registry_asset.py --check
      - name: Diagnostic Evaluator Self-Test
        run: python3 verification/evaluate_diagnostic.py --self-test
      - name: Dependency Reverification Gate
        run: python3 verification/impact_report.py --gate
      - name: Release Verification Dashboard
        run: python3 verification/release_dashboard.py >> "$GITHUB_STEP_SUMMARY"
