name: Verify Master Registry

on:
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - "verification/**"
      - "ci/validate_verification_registry.py"
      - ".github/workflows/verify-registry.yml"
  push:
    branches: [ "main", "master" ]
    paths:
      - "verification/**"
      - "ci/validate_verification_registry.py"
      - ".github/workflows/verify-registry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Validate Master Verification Registry
        run: python3 ci/validate_verification_registry.py
