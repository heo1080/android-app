name: Dolphin Launcher V1 Fixed Voice Preview APK

on:
  push:
    branches:
      - dolphin-launcher-v1-fixed-voice-preview-apk
      - dolphin-launcher-v1-ui-reference-dock
    paths:
      - "dolphin-launcher-v1/app/build.gradle.kts"
      - "dolphin-launcher-v1/app/src/main/assets/voice_prompt_manifest.json"
      - "dolphin-launcher-v1/app/src/main/assets/verification_registry.json"
      - "dolphin-launcher-v1/app/src/main/assets/test_log_contracts.json"
      - "dolphin-launcher-v1/app/src/main/assets/runtime_surfaces.json"
      - "dolphin-launcher-v1/app/src/main/java/com/dolphin/launcher/v1/AppUpdateManager.java"
      - "dolphin-launcher-v1/app/src/main/java/com/dolphin/launcher/v1/LauncherActivity.java"
      - "dolphin-launcher-v1/app/src/main/java/com/dolphin/launcher/v1/VehiclePromptPlayer.java"
      - "dolphin-launcher-v1/app/src/main/java/com/dolphin/launcher/v1/VehicleVoicePolicy.java"
      - "dolphin-launcher-v1/tools/generate_ppaso_voice_candidate.py"
      - "dolphin-launcher-v1/tools/prepare_fixed_voice_preview.py"
      - ".github/workflows/dolphin-launcher-v1-fixed-voice-preview-apk.yml"
  pull_request:
    branches:
      - dolphin-launcher-v1-ui-reference-dock
    paths:
      - "dolphin-launcher-v1/**"
      - ".github/workflows/dolphin-launcher-v1-fixed-voice-preview-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dolphin-v1-fixed-voice-preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet             "huggingface_hub>=0.35,<2"             "onnxruntime>=1.20,<2"             "python-mecab-ko>=1.3,<2"             "soundfile>=0.12,<1"             "numpy>=1.26,<3"

      - name: Verify canonical voice state and preview policy
        shell: bash
        run: |
          set -euo pipefail
          python3 dolphin-launcher-v1/tools/generate_ppaso_voice_candidate.py self-test
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path("dolphin-launcher-v1")
          manifest=json.load(open(root/"app/src/main/assets/voice_prompt_manifest.json",encoding="utf-8"))
          assert len(manifest.get("prompts",[]))==22
          assert {p.get("state") for p in manifest["prompts"]}=={"ASSET_REQUIRED"}
          gradle=(root/"app/build.gradle.kts").read_text(encoding="utf-8")
          update=(root/"app/src/main/java/com/dolphin/launcher/v1/AppUpdateManager.java").read_text(encoding="utf-8")
          for token in (
              'create("voicePreview")',
              'applicationIdSuffix = ".voicepreview"',
              'buildConfigField("boolean", "VOICE_PREVIEW_BUILD", "true")',
          ):
              assert token in gradle,token
          for token in (
              "suppressForVoicePreview",
              "APP_UPDATE_SUPPRESSED_PREVIEW_BUILD",
              "voice_preview=true;network_check=false;installer=false",
          ):
              assert token in update,token
          print("VOICE_PREVIEW_POLICY_OK canonical_manifest=ASSET_REQUIRED ota_suppressed=true")
          PY
          sha256sum dolphin-launcher-v1/app/src/main/assets/voice_prompt_manifest.json             > "$RUNNER_TEMP/canonical-voice-manifest.sha256"

      - name: Resolve pinned Ppaso runtime
        shell: bash
        env:
          MODEL_DIR: ${{ runner.temp }}/ppaso-model
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from huggingface_hub import HfApi, snapshot_download

          repo="akamotaco/ppaso-tts-v1"
          requested="53d09664c4f636a5fb6f2ebe3ec22cd83ee249b9"
          info=HfApi().model_info(repo, revision=requested)
          revision=str(info.sha)
          if revision != requested:
              raise SystemExit(f"model revision mismatch requested={requested} resolved={revision}")
          local=os.environ["MODEL_DIR"]
          snapshot_download(
              repo_id=repo,
              revision=revision,
              local_dir=local,
              allow_patterns=[
                  "config.json",
                  "LICENSE",
                  "onnx/**",
                  "runtime/**",
                  "example/ppaso_tts.py",
              ],
          )
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as env:
              env.write(f"PPASO_MODEL_REVISION={revision}\n")
              env.write(f"PPASO_MODEL_DIR={local}\n")
          print(f"VOICE_PREVIEW_MODEL_RESOLVED repo={repo} revision={revision}")
          PY

      - name: Generate and validate 22 candidate WAVs
        shell: bash
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/fixed-voice-candidate
        run: |
          set -euo pipefail
          python3 dolphin-launcher-v1/tools/generate_ppaso_voice_candidate.py generate             --model-dir "$PPASO_MODEL_DIR"             --model-revision "$PPASO_MODEL_REVISION"             --output-dir "$CANDIDATE_DIR"
          test "$(find "$CANDIDATE_DIR" -maxdepth 1 -type f -name 'voice_*.wav' | wc -l)" -eq 22

      - name: Prepare workspace-only preview overlay
        shell: bash
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/fixed-voice-candidate
        run: |
          set -euo pipefail
          python3 dolphin-launcher-v1/tools/prepare_fixed_voice_preview.py             --candidate-dir "$CANDIDATE_DIR"
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path("dolphin-launcher-v1")
          manifest=json.load(open(root/"app/src/main/assets/voice_prompt_manifest.json",encoding="utf-8"))
          prompts=manifest["prompts"]
          assert len(prompts)==22
          assert {p.get("state") for p in prompts}=={"ASSET_READY"}
          assert all(p.get("preview_only") is True for p in prompts)
          assert manifest.get("preview_build",{}).get("preview_package")=="com.dolphin.launcher.v1.voicepreview"
          assert manifest.get("preview_build",{}).get("promotion_allowed") is False
          raw=list((root/"app/src/main/res/raw").glob("voice_*.wav"))
          assert len(raw)==22,len(raw)
          print("VOICE_PREVIEW_WORKSPACE_READY preview_assets=22 canonical_manifest_unchanged=pending_restore")
          PY

      - name: Build voice preview APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p dolphin-launcher-v1 :app:assembleVoicePreview --stacktrace
          APK="$(find dolphin-launcher-v1/app/build/outputs/apk/voicePreview -type f -name '*.apk' | head -n 1)"
          test -s "$APK"
          printf 'VOICE_PREVIEW_UNSIGNED_APK=%s\n' "$APK" >> "$GITHUB_ENV"

      - name: Validate preview APK identity and packaged voice assets
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          BADGING_ALL="$("$AAPT" dump badging "$VOICE_PREVIEW_UNSIGNED_APK")"
          BADGING="$(printf '%s\n' "$BADGING_ALL" | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "package: name='com.dolphin.launcher.v1.voicepreview'"
          echo "$BADGING" | grep -q "versionCode='11'"
          echo "$BADGING" | grep -q "versionName='1.2.8-v1-premium-realcar-beta-voice-preview'"
          printf '%s\n' "$BADGING_ALL" | grep -q "^sdkVersion:'29'$"
          printf '%s\n' "$BADGING_ALL" | grep -q "^targetSdkVersion:'35'$"

          unzip -p "$VOICE_PREVIEW_UNSIGNED_APK" assets/voice_prompt_manifest.json             > "$RUNNER_TEMP/preview-voice-manifest.json"
          python3 - "$RUNNER_TEMP/preview-voice-manifest.json" "$VOICE_PREVIEW_UNSIGNED_APK" <<'PY'
          import hashlib, json, re, sys, zipfile
          manifest=json.load(open(sys.argv[1],encoding="utf-8"))
          apk=sys.argv[2]
          prompts=manifest.get("prompts",[])
          assert len(prompts)==22
          assert {p.get("state") for p in prompts}=={"ASSET_READY"}
          assert all(p.get("preview_only") is True for p in prompts)
          preview=manifest.get("preview_build",{})
          assert preview.get("enabled") is True
          assert preview.get("canonical_package")=="com.dolphin.launcher.v1"
          assert preview.get("preview_package")=="com.dolphin.launcher.v1.voicepreview"
          assert preview.get("canonical_repository_state")=="ASSET_REQUIRED"
          assert preview.get("workspace_state")=="ASSET_READY"
          assert preview.get("promotion_allowed") is False
          expected={(str(p["sha256"]).lower(),int(p["bytes"])) for p in prompts}
          assert len(expected)==22,("manifest payload identity drift",len(expected))
          with zipfile.ZipFile(apk) as z:
              wav_entries=[n for n in z.namelist() if n.lower().endswith(".wav")]
              actual=set()
              for name in wav_entries:
                  data=z.read(name)
                  actual.add((hashlib.sha256(data).hexdigest(),len(data)))
              assert len(wav_entries)==22,(len(wav_entries),wav_entries)
              assert len(actual)==22,("duplicate packaged wav payload",len(actual))
              assert actual==expected,("packaged wav SHA/byte set mismatch",sorted(actual),sorted(expected))
          print("VOICE_PREVIEW_APK_CONTENT_OK preview_assets=22 sha256_set=verified aapt_path_independent=true canonical_manifest_unchanged=true")
          PY

      - name: Restore stable signing key
        shell: bash
        env:
          DOLPHIN_KEYSTORE_BASE64: ${{ secrets.DOLPHIN_KEYSTORE_BASE64 }}
          DOLPHIN_KEYSTORE_PASSWORD: ${{ secrets.DOLPHIN_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/dolphin-release.jks"
          printf '%s' "$DOLPHIN_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          PASS="$(printf '%s' "$DOLPHIN_KEYSTORE_PASSWORD" | tr -d '\r\n')"
          keytool -list -keystore "$KEYSTORE" -storepass "$PASS" -alias dolphinassistant >/dev/null

      - name: Sign fixed voice preview APK
        shell: bash
        env:
          DOLPHIN_KEYSTORE_PASSWORD: ${{ secrets.DOLPHIN_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          PASS="$(printf '%s' "$DOLPHIN_KEYSTORE_PASSWORD" | tr -d '\r\n')"
          export DOLPHIN_KS_PASS="$PASS"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          SIGNED="dolphin-launcher-v1/app/build/outputs/apk/voicePreview/DolphinLauncherV1-FixedVoicePreview.apk"
          "$APKSIGNER" sign             --ks "$RUNNER_TEMP/dolphin-release.jks"             --ks-key-alias dolphinassistant             --ks-pass env:DOLPHIN_KS_PASS             --key-pass env:DOLPHIN_KS_PASS             --out "$SIGNED"             "$VOICE_PREVIEW_UNSIGNED_APK"
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED"
          sha256sum "$SIGNED"             | tee dolphin-launcher-v1/app/build/outputs/apk/voicePreview/DolphinLauncherV1-FixedVoicePreview.sha256
          printf 'VOICE_PREVIEW_SIGNED_APK=%s\n' "$SIGNED" >> "$GITHUB_ENV"

      - name: Restore canonical repository state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- dolphin-launcher-v1/app/src/main/assets/voice_prompt_manifest.json
          find dolphin-launcher-v1/app/src/main/res/raw -maxdepth 1 -type f -name 'voice_*.wav' -delete 2>/dev/null || true
          sha256sum -c "$RUNNER_TEMP/canonical-voice-manifest.sha256"
          test -z "$(git status --porcelain --             dolphin-launcher-v1/app/src/main/assets/voice_prompt_manifest.json             dolphin-launcher-v1/app/src/main/res/raw)"
          python3 - <<'PY'
          import json
          p="dolphin-launcher-v1/app/src/main/assets/voice_prompt_manifest.json"
          manifest=json.load(open(p,encoding="utf-8"))
          assert {x.get("state") for x in manifest["prompts"]}=={"ASSET_REQUIRED"}
          assert not manifest.get("preview_build",{}).get("enabled",False)
          print("VOICE_PREVIEW_RESTORE_OK canonical_manifest_unchanged=true canonical_state=ASSET_REQUIRED")
          PY

      - name: Upload signed fixed voice preview APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Dolphin-Launcher-V1-FixedVoicePreview
          retention-days: 14
          if-no-files-found: error
          path: |
            dolphin-launcher-v1/app/build/outputs/apk/voicePreview/DolphinLauncherV1-FixedVoicePreview.apk
            dolphin-launcher-v1/app/build/outputs/apk/voicePreview/DolphinLauncherV1-FixedVoicePreview.sha256
            ${{ runner.temp }}/fixed-voice-candidate/ppaso_candidate_manifest.json

      - name: Attach Fixed Voice Preview to real-car BETA prerelease
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/dolphin-launcher-v1-ui-reference-dock'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' dolphin-launcher-v1/app/build.gradle.kts | head -n 1)"
          SEMVER="$(printf '%s' "$VERSION" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          TAG="dolphin-launcher-v1-v${SEMVER}-realcar-beta1"
          APK="dolphin-launcher-v1/app/build/outputs/apk/voicePreview/DolphinLauncherV1-FixedVoicePreview.apk"
          SHA="dolphin-launcher-v1/app/build/outputs/apk/voicePreview/DolphinLauncherV1-FixedVoicePreview.sha256"
          MANIFEST="$RUNNER_TEMP/fixed-voice-candidate/ppaso_candidate_manifest.json"

          CANONICAL_READY=false
          for ATTEMPT in $(seq 1 36); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              RELEASE_JSON="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
                --json targetCommitish,isPrerelease,assets)"
              TARGET="$(printf '%s' "$RELEASE_JSON" | jq -r '.targetCommitish')"
              ASSET_NAMES="$(printf '%s' "$RELEASE_JSON" | jq -r '.assets[].name')"
              PREVIEW_COUNT=0
              for REQUIRED in \
                "DolphinLauncherV1-FixedVoicePreview.apk" \
                "DolphinLauncherV1-FixedVoicePreview.sha256" \
                "ppaso_candidate_manifest.json"; do
                if grep -Fxq "$REQUIRED" <<<"$ASSET_NAMES"; then
                  PREVIEW_COUNT=$((PREVIEW_COUNT+1))
                fi
              done
              if [ "$TARGET" != "$GITHUB_SHA" ]; then
                if [ "$PREVIEW_COUNT" -eq 3 ]; then
                  echo "VOICE_PREVIEW_BETA_RELEASE_IMMUTABLE tag=$TAG upload=false canonical_release_required=true"
                  exit 0
                fi
                echo "VOICE_PREVIEW_RELEASE_TARGET_MISMATCH tag=$TAG target=$TARGET head=$GITHUB_SHA" >&2
                exit 1
              fi
              test "$(printf '%s' "$RELEASE_JSON" | jq -r '.isPrerelease')" = "true"
              CANONICAL_MISSING=""
              for REQUIRED in \
                "DolphinLauncherV1-Evolution.apk" \
                "DolphinLauncherV1-Evolution.sha256" \
                "DolphinLauncherV1-RealCarValidation.json"; do
                if ! grep -Fxq "$REQUIRED" <<<"$ASSET_NAMES"; then
                  CANONICAL_MISSING="$CANONICAL_MISSING,$REQUIRED"
                fi
              done
              if [ -z "$CANONICAL_MISSING" ]; then
                CANONICAL_READY=true
                echo "VOICE_PREVIEW_CANONICAL_RELEASE_READY tag=$TAG canonical_release_required=true"
                break
              fi
              echo "VOICE_PREVIEW_WAITING_FOR_CANONICAL tag=$TAG attempt=$ATTEMPT missing=${CANONICAL_MISSING#,}"
            else
              echo "VOICE_PREVIEW_WAITING_FOR_CANONICAL tag=$TAG attempt=$ATTEMPT missing=release"
            fi
            sleep 10
          done
          if [ "$CANONICAL_READY" != "true" ]; then
            echo "VOICE_PREVIEW_RELEASE_INCOMPLETE tag=$TAG canonical_release_required=true" >&2
            exit 1
          fi

          if [ "$PREVIEW_COUNT" -eq 3 ]; then
            echo "VOICE_PREVIEW_BETA_RELEASE_IMMUTABLE tag=$TAG upload=false canonical_release_required=true"
            exit 0
          fi
          if [ "$PREVIEW_COUNT" -ne 0 ]; then
            echo "VOICE_PREVIEW_RELEASE_INCOMPLETE tag=$TAG preview_assets=$PREVIEW_COUNT/3" >&2
            exit 1
          fi
          gh release upload "$TAG" "$APK" "$SHA" "$MANIFEST" \
            --repo "$GITHUB_REPOSITORY"
          echo "VOICE_PREVIEW_BETA_RELEASE_ASSET_OK tag=$TAG preview_only=true promotion_allowed=false canonical_release_required=true"
