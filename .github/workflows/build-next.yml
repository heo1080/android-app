name: Build DolphinAssistant Next

on:
  push:
    branches: [ "next/dolphinassistant-next" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dolphinassistant-next-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: "17"
        distribution: "temurin"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7

    - name: Grant gradlew execute
      run: chmod +x gradlew

    - name: Download sherpa-onnx runtime
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p nextapp/libs
        curl -fL --retry 4 --retry-delay 2 \
          -o nextapp/libs/sherpa-onnx-1.13.4.aar \
          https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.4/sherpa-onnx-1.13.4.aar
        test -s nextapp/libs/sherpa-onnx-1.13.4.aar

    - name: Build clean Next release
      run: ./gradlew :nextapp:assembleRelease --stacktrace

    - name: Validate manifest identity
      shell: bash
      run: |
        set -euo pipefail
        AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
        APK="nextapp/build/outputs/apk/release/nextapp-release-unsigned.apk"
        BADGING="$("$AAPT" dump badging "$APK" | head -n 1)"
        echo "$BADGING"
        echo "$BADGING" | grep -q "name='com.byd.dolphin.autoassistant'"
        echo "$BADGING" | grep -q "versionCode='113'"
        echo "$BADGING" | grep -q "v34.2.0"

    - name: Decode and validate stable signing keystore
      shell: bash
      env:
        DOLPHIN_KEYSTORE_BASE64: ${{ secrets.DOLPHIN_KEYSTORE_BASE64 }}
        DOLPHIN_KEYSTORE_PASSWORD: ${{ secrets.DOLPHIN_KEYSTORE_PASSWORD }}
      run: |
        set -euo pipefail
        KEYSTORE="$RUNNER_TEMP/dolphin-release.jks"
        printf '%s' "$DOLPHIN_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
        test -s "$KEYSTORE"
        EXPECTED_KEYSTORE_SHA256="6f343e0060b185d82a6002cf4be8650099a4ef02849083b210fba3bbe3889953"
        ACTUAL_KEYSTORE_SHA256="$(sha256sum "$KEYSTORE" | awk '{print $1}')"
        test "$ACTUAL_KEYSTORE_SHA256" = "$EXPECTED_KEYSTORE_SHA256"
        PASS="$(printf '%s' "$DOLPHIN_KEYSTORE_PASSWORD" | tr -d '\r\n')"
        keytool -list -keystore "$KEYSTORE" -storepass "$PASS" -alias dolphinassistant >/dev/null

    - name: Sign Next APK
      shell: bash
      env:
        DOLPHIN_KEYSTORE_PASSWORD: ${{ secrets.DOLPHIN_KEYSTORE_PASSWORD }}
      run: |
        set -euo pipefail
        PASS="$(printf '%s' "$DOLPHIN_KEYSTORE_PASSWORD" | tr -d '\r\n')"
        export PASS
        APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
        UNSIGNED="nextapp/build/outputs/apk/release/nextapp-release-unsigned.apk"
        SIGNED="nextapp/build/outputs/apk/release/DolphinAssistant-Next-v34.2.0.apk"
        "$APKSIGNER" sign \
          --ks "$RUNNER_TEMP/dolphin-release.jks" \
          --ks-key-alias dolphinassistant \
          --ks-pass env:PASS \
          --key-pass env:PASS \
          --out "$SIGNED" \
          "$UNSIGNED"
        "$APKSIGNER" verify --verbose --print-certs "$SIGNED"
        sha256sum "$SIGNED" | tee nextapp/build/outputs/apk/release/DolphinAssistant-Next-v34.2.0.sha256

    - name: Publish updater-visible Next release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        TAG="v34.2.0"
        APK="nextapp/build/outputs/apk/release/DolphinAssistant-Next-v34.2.0.apk"
        SHA="nextapp/build/outputs/apk/release/DolphinAssistant-Next-v34.2.0.sha256"
        NOTES="DolphinAssistant Next v34.2.0 is the stability recovery build after the v34 launcher regression. It preserves the launcher/FSD/vehicle dashboard but restores proven v32.3 behavior where possible. Audio: fixes a non-reentrant AudioPlaybackGate double-lock that deadlocked cached Supertonic TTS and then blocked all stream14 beeps; TTS now acquires the stream14 gate only once. Diagnostics: the launcher diagnostic tile now opens a live result dialog showing RUNNING/PASS/FAIL/NO_SIGNAL per test plus full-session upload instead of silently changing a card. Split screen: 2-pane now delegates to the proven v32.3 mode3/mode4 state machine with ghost primary activity, task move fallback, runtime verification, saved last configuration and resize-docked-stack ratio control; the UI restores 20-80 percent adjustment in exact 1 percent steps with +/-1 and apply. Floating: restores movable handle drag, saved position, default 15-second idle collapse to a single diamond handle, tap-to-expand, 8 visible items then horizontal scroll, scale 50-150 percent, opacity 30-100 percent, collapse timing and position reset. Quick Bar: adds a dedicated real MAIN+LAUNCHER activity and refreshes the launcher component after package replacement so the BYD app drawer can index it again. DiLink settings: removes unsupported notification/media-session settings intents and replaces them with a local-ADB notification-listener status/allow bridge. HUD: guards Bluetooth API errors and always returns connection/profile callbacks on the main thread to prevent UI/Toast crashes. The v34.1 DiLink install fix, Capability Router, TBT Correlation, Cluster Resource Inspector, background-media boot automation and full diagnostics remain included."

        if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release upload "$TAG" "$APK" "$SHA" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "DolphinAssistant Next v34.2.0" --notes "$NOTES"
        else
          gh release create "$TAG" "$APK" "$SHA" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "DolphinAssistant Next v34.2.0" --notes "$NOTES"
        fi

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: DolphinAssistant-Next-v34.2.0
        path: |
          nextapp/build/outputs/apk/release/DolphinAssistant-Next-v34.2.0.apk
          nextapp/build/outputs/apk/release/DolphinAssistant-Next-v34.2.0.sha256
        if-no-files-found: error
        retention-days: 30
