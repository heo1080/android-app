name: Build DolphinAssistant Next

on:
  push:
    branches: [ "next/dolphinassistant-next" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dolphinassistant-next-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: "17"
        distribution: "temurin"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7

    - name: Grant gradlew execute
      run: chmod +x gradlew

    - name: Download sherpa-onnx runtime
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p nextapp/libs
        curl -fL --retry 4 --retry-delay 2 \
          -o nextapp/libs/sherpa-onnx-1.13.4.aar \
          https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.4/sherpa-onnx-1.13.4.aar
        test -s nextapp/libs/sherpa-onnx-1.13.4.aar

    - name: Build clean Next release
      run: ./gradlew :nextapp:assembleRelease --stacktrace

    - name: Validate manifest identity
      shell: bash
      run: |
        set -euo pipefail
        AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
        APK="nextapp/build/outputs/apk/release/nextapp-release-unsigned.apk"
        BADGING="$("$AAPT" dump badging "$APK" | head -n 1)"
        echo "$BADGING"
        echo "$BADGING" | grep -q "name='com.byd.dolphin.autoassistant'"
        echo "$BADGING" | grep -q "versionCode='108'"
        echo "$BADGING" | grep -q "v33.0.1"

    - name: Decode and validate stable signing keystore
      shell: bash
      env:
        DOLPHIN_KEYSTORE_BASE64: ${{ secrets.DOLPHIN_KEYSTORE_BASE64 }}
        DOLPHIN_KEYSTORE_PASSWORD: ${{ secrets.DOLPHIN_KEYSTORE_PASSWORD }}
      run: |
        set -euo pipefail
        KEYSTORE="$RUNNER_TEMP/dolphin-release.jks"
        printf '%s' "$DOLPHIN_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
        test -s "$KEYSTORE"
        EXPECTED_KEYSTORE_SHA256="6f343e0060b185d82a6002cf4be8650099a4ef02849083b210fba3bbe3889953"
        ACTUAL_KEYSTORE_SHA256="$(sha256sum "$KEYSTORE" | awk '{print $1}')"
        test "$ACTUAL_KEYSTORE_SHA256" = "$EXPECTED_KEYSTORE_SHA256"
        PASS="$(printf '%s' "$DOLPHIN_KEYSTORE_PASSWORD" | tr -d '\r\n')"
        keytool -list -keystore "$KEYSTORE" -storepass "$PASS" -alias dolphinassistant >/dev/null

    - name: Sign Next APK
      shell: bash
      env:
        DOLPHIN_KEYSTORE_PASSWORD: ${{ secrets.DOLPHIN_KEYSTORE_PASSWORD }}
      run: |
        set -euo pipefail
        PASS="$(printf '%s' "$DOLPHIN_KEYSTORE_PASSWORD" | tr -d '\r\n')"
        export PASS
        APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
        UNSIGNED="nextapp/build/outputs/apk/release/nextapp-release-unsigned.apk"
        SIGNED="nextapp/build/outputs/apk/release/DolphinAssistant-Next-v33.0.1.apk"
        "$APKSIGNER" sign \
          --ks "$RUNNER_TEMP/dolphin-release.jks" \
          --ks-key-alias dolphinassistant \
          --ks-pass env:PASS \
          --key-pass env:PASS \
          --out "$SIGNED" \
          "$UNSIGNED"
        "$APKSIGNER" verify --verbose --print-certs "$SIGNED"
        sha256sum "$SIGNED" | tee nextapp/build/outputs/apk/release/DolphinAssistant-Next-v33.0.1.sha256

    - name: Publish updater-visible Next release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        TAG="v33.0.1"
        APK="nextapp/build/outputs/apk/release/DolphinAssistant-Next-v33.0.1.apk"
        SHA="nextapp/build/outputs/apk/release/DolphinAssistant-Next-v33.0.1.sha256"
        NOTES="DolphinAssistant Next v33.0.1 keeps the integrated v33.0.0 real-car test suite and changes ignition media automation to true background-first playback. Rules marked as media no longer launch the app Activity or bring its UI to the foreground. At the app-specific delay, DolphinAssistant first reuses an active MediaSession when available, otherwise connects to the target app's MediaBrowserService in the background and retains the resulting MediaController. After the configured media delay it sends transportControls.play() only to that package. If no active session or MediaBrowserService exists, it attempts an explicit package-scoped MEDIA_BUTTON receiver/service. It deliberately does not use a global AudioManager PLAY fallback because that could resume the wrong media app. The startup UI now labels this behavior as media background playback and links to notification-listener access for active-session discovery. All prepare/play attempts, package names, endpoints and playback-state verification are written to MEDIA_BG/BOOT_AUTO logs and included in the existing FULL TEST SESSION diagnostics. All v33 integrated split-screen, Quick Dock, T90P/cluster TBT, mirror/seat/light LAB, driver-audio research, TTS warmup and event diagnostics remain included."

        if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release upload "$TAG" "$APK" "$SHA" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "DolphinAssistant Next v33.0.1" --notes "$NOTES"
        else
          gh release create "$TAG" "$APK" "$SHA" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "DolphinAssistant Next v33.0.1" --notes "$NOTES"
        fi

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: DolphinAssistant-Next-v33.0.1
        path: |
          nextapp/build/outputs/apk/release/DolphinAssistant-Next-v33.0.1.apk
          nextapp/build/outputs/apk/release/DolphinAssistant-Next-v33.0.1.sha256
        if-no-files-found: error
        retention-days: 30
