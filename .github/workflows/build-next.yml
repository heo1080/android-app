name: Build DolphinAssistant Next

on:
  push:
    branches: [ "next/dolphinassistant-next" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dolphinassistant-next-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: "17"
        distribution: "temurin"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7

    - name: Grant gradlew execute
      run: chmod +x gradlew

    - name: Download sherpa-onnx runtime
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p nextapp/libs
        curl -fL --retry 4 --retry-delay 2 \
          -o nextapp/libs/sherpa-onnx-1.13.4.aar \
          https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.4/sherpa-onnx-1.13.4.aar
        test -s nextapp/libs/sherpa-onnx-1.13.4.aar

    - name: Build clean Next release
      run: ./gradlew :nextapp:assembleRelease --stacktrace

    - name: Validate manifest identity
      shell: bash
      run: |
        set -euo pipefail
        AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
        APK="nextapp/build/outputs/apk/release/nextapp-release-unsigned.apk"
        BADGING="$("$AAPT" dump badging "$APK" | head -n 1)"
        echo "$BADGING"
        echo "$BADGING" | grep -q "name='com.byd.dolphin.autoassistant'"
        echo "$BADGING" | grep -q "versionCode='111'"
        echo "$BADGING" | grep -q "v34.1.0"

    - name: Decode and validate stable signing keystore
      shell: bash
      env:
        DOLPHIN_KEYSTORE_BASE64: ${{ secrets.DOLPHIN_KEYSTORE_BASE64 }}
        DOLPHIN_KEYSTORE_PASSWORD: ${{ secrets.DOLPHIN_KEYSTORE_PASSWORD }}
      run: |
        set -euo pipefail
        KEYSTORE="$RUNNER_TEMP/dolphin-release.jks"
        printf '%s' "$DOLPHIN_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
        test -s "$KEYSTORE"
        EXPECTED_KEYSTORE_SHA256="6f343e0060b185d82a6002cf4be8650099a4ef02849083b210fba3bbe3889953"
        ACTUAL_KEYSTORE_SHA256="$(sha256sum "$KEYSTORE" | awk '{print $1}')"
        test "$ACTUAL_KEYSTORE_SHA256" = "$EXPECTED_KEYSTORE_SHA256"
        PASS="$(printf '%s' "$DOLPHIN_KEYSTORE_PASSWORD" | tr -d '\r\n')"
        keytool -list -keystore "$KEYSTORE" -storepass "$PASS" -alias dolphinassistant >/dev/null

    - name: Sign Next APK
      shell: bash
      env:
        DOLPHIN_KEYSTORE_PASSWORD: ${{ secrets.DOLPHIN_KEYSTORE_PASSWORD }}
      run: |
        set -euo pipefail
        PASS="$(printf '%s' "$DOLPHIN_KEYSTORE_PASSWORD" | tr -d '\r\n')"
        export PASS
        APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
        UNSIGNED="nextapp/build/outputs/apk/release/nextapp-release-unsigned.apk"
        SIGNED="nextapp/build/outputs/apk/release/DolphinAssistant-Next-v34.1.0.apk"
        "$APKSIGNER" sign \
          --ks "$RUNNER_TEMP/dolphin-release.jks" \
          --ks-key-alias dolphinassistant \
          --ks-pass env:PASS \
          --key-pass env:PASS \
          --out "$SIGNED" \
          "$UNSIGNED"
        "$APKSIGNER" verify --verbose --print-certs "$SIGNED"
        sha256sum "$SIGNED" | tee nextapp/build/outputs/apk/release/DolphinAssistant-Next-v34.1.0.sha256

    - name: Publish updater-visible Next release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        TAG="v34.1.0"
        APK="nextapp/build/outputs/apk/release/DolphinAssistant-Next-v34.1.0.apk"
        SHA="nextapp/build/outputs/apk/release/DolphinAssistant-Next-v34.1.0.sha256"
        NOTES="DolphinAssistant Next v34.1.0 keeps the v34 Launcher and integrates the latest BYD Dolphin research probes. A central Capability Router now classifies BYD device families as READ_WRITE_CANDIDATE, READ_ONLY, BLOCKED or MISSING using read-only getInstance/getter probes plus setter inventory; results are visible in LAB and exported as capability_router.json. Ignition startup now includes a lightweight 60-second Launcher Watchdog that stops as soon as the Launcher resumes, otherwise retries explicit HOME start at most twice and never keeps stealing focus afterward. Cluster Hub adds a read-only 60-second TBT CORRELATION test for AUTONAVI_STANDARD_BROADCAST_SEND: it observes real OEM broadcasts, receiver/package candidates, Amap/autonavi service evidence and relevant logcat without sending a synthetic navigation broadcast. Cluster Hub also adds a read-only RESOURCE INSPECTOR that inventories candidate cluster_theme RCC/QML/QM/font/libBydCluster resources, file metadata/SHA256 and selected strings without modifying OEM files. FULL TEST SESSION now includes capability_router.json and tbt_correlation.json in addition to the full integrated log. All v34 Launcher media/FSD/vehicle dashboard, Quick Bar, background media startup, Cluster Hub projection labs, T90P HUD, multi-window and diagnostics remain included."

        if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release upload "$TAG" "$APK" "$SHA" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "DolphinAssistant Next v34.1.0" --notes "$NOTES"
        else
          gh release create "$TAG" "$APK" "$SHA" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "DolphinAssistant Next v34.1.0" --notes "$NOTES"
        fi

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: DolphinAssistant-Next-v34.1.0
        path: |
          nextapp/build/outputs/apk/release/DolphinAssistant-Next-v34.1.0.apk
          nextapp/build/outputs/apk/release/DolphinAssistant-Next-v34.1.0.sha256
        if-no-files-found: error
        retention-days: 30
